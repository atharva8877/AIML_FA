<head>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Student Exam Performance Predictor</h2>
        <form id="prediction_form" class="form">
            <label for="gender">Gender:</label>
            <select id="gender" class="input-field">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="ethnicity">Race or Ethnicity:</label>
            <select id="ethnicity" class="input-field">
                <option value="Group A">Group A</option>
                <option value="Group B">Group B</option>
                <option value="Group C">Group C</option>
                <option value="Group D">Group D</option>
                <option value="Group E">Group E</option>
            </select>

            <label for="parent_education">Parental Level of Education:</label>
            <select id="parent_education" class="input-field">
                <option value="Associate's Degree">Associate's Degree</option>
                <option value="Bachelor's Degree">Bachelor's Degree</option>
                <option value="High School">High School</option>
                <option value="Master's Degree">Master's Degree</option>
                <option value="Some College">Some College</option>
                <option value="Some High School">Some High School</option>
            </select>

            <label for="lunch">Lunch Type:</label>
            <select id="lunch" class="input-field">
                <option value="Free/Reduced">Free/Reduced</option>
                <option value="Standard">Standard</option>
            </select>

            <label for="test_preparation">Test Preparation Course:</label>
            <select id="test_preparation" class="input-field">
                <option value="None">None</option>
                <option value="Completed">Completed</option>
            </select>

            <label for="reading_score">Reading Score (0-100):</label>
            <input type="number" id="reading_score" class="input-field" min="0" max="100" required />

            <label for="writing_score">Writing Score (0-100):</label>
            <input type="number" id="writing_score" class="input-field" min="0" max="100" required />

            <button type="submit" class="submit-btn">Predict Performance</button>
        </form>

        <div id="prediction_result" class="result-display"></div>
    </div>

    <script>
        document.getElementById('prediction_form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const data = {
                gender: document.getElementById('gender').value,
                ethnicity: document.getElementById('ethnicity').value,
                parent_education: document.getElementById('parent_education').value,
                lunch: document.getElementById('lunch').value,
                test_preparation: document.getElementById('test_preparation').value,
                reading_score: parseInt(document.getElementById('reading_score').value),
                writing_score: parseInt(document.getElementById('writing_score').value)
            };

            try {
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                document.getElementById('prediction_result').innerText = "Prediction is: " + result.prediction;
            } catch (error) {
                document.getElementById('prediction_result').innerText = "Error occurred while predicting.";
                console.error("Error:", error);
            }
        });
    </script>
</body>
